<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home - haydencrain.dev</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" href="/favicon.ico">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <style>
    body {
      display: grid;
      grid-template-columns: auto auto;
      justify-content: center;
      justify-items: center;
      align-items: center;
      align-content: center;
      gap: 2rem;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      box-sizing: border-box;
      background: #f5f5f5;
      font-family: 'Nanum Pen Script', cursive;
      text-align: center;
      cursor: url("cursor-default.png") 0 0, auto;
    }
    a,
    button,
    input,
    select,
    textarea,
    [role="button"],
    [onclick] {
      cursor: url("cursor-pointer.png") 0 0, pointer;
    }
    img {
      width: min(292px, 60vw, 80vh * 292 / 851);
      aspect-ratio: 292 / 851;
      height: auto;
    }
    p {
      margin: 0;
      font-size: 2.5rem;
      color: #222;
    }
    .prefix {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .prefix .name {
      font-size: 3rem;
    }
    @media (max-width: 600px) {
      body {
        grid-template-columns: 1fr;
      }
      img {
        order: 1;
        width: min(292px, 60vw);
      }
      .prefix {
        order: 0;
      }
    }
  </style>
</head>
<body>
  <img src="hayden-standing.avif" alt="Hayden Crain" width="292" height="851">
  <p class="prefix">
    hello, thank u for visiting<br>
    <span class="name">HAYDEN CRAIN's</span><br>
    webpage
  </p>
</body>
</html>
